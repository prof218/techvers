name: Deploy to Vercel (Production)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Avoid overlapping production deploys
concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_vNUCWyrDJW6vaW9Yd7Wpoy10
  VERCEL_PROJECT_ID: prj_Y6HWu1BSgwlvLSXw7rnmfEgvaP7q

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Remote build on Vercel's infrastructure: uploads only the project
      # SOURCE (a few hundred files) instead of the prebuilt output (thousands),
      # which avoids the free-plan "api-upload-free" limit (5000 uploads / 24h).
      # Vercel runs `npm run build` (which runs Velite via the prebuild script).
      - name: Deploy to production (remote build)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
